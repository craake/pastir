# pastir role → CLI/model mapping.  Sourced by bash: KEY=value, no spaces around '='.
# Edit this file to swap any role to a different CLI or model.
#
# Supported CLIs: claude | codex | omp
#   claude model aliases: opus, sonnet, haiku (or a full id like claude-opus-5-5)
#   codex  model ids:     gpt-6.2-sol, gpt-6.2-astra, ...
#   omp    model ids:     whatever `omp --list-models` shows (verify flags, see README)

# ── Orchestrator: drives the loop, never edits code itself (must be claude) ──
# It only routes work, so Sonnet is enough; set opus for stronger judgment on plan/redo decisions.
ORCHESTRATOR_MODEL=sonnet

# ── Planning ──
PLANNER_CLI=claude
PLANNER_MODEL=opus
# Read-only: may explore the repo, may not edit.
PLANNER_FLAGS='--disallowedTools Edit,Write,NotebookEdit'

# ── Implementation ──
IMPLEMENTER_CLI=claude
IMPLEMENTER_MODEL=sonnet
# Needs to edit files AND run tests/builds unattended. Runs on a throwaway
# pastir/* branch (unless NEW_BRANCH=no / --current-branch) inside WSL. Tighten if you prefer (e.g. --permission-mode acceptEdits
# plus --allowedTools "Bash(npm test:*)").
IMPLEMENTER_FLAGS='--permission-mode bypassPermissions'

# ── Code review ──
REVIEWER_CLI=codex
REVIEWER_MODEL=gpt-6.2-sol
# Read-only sandbox, high reasoning effort.
REVIEWER_FLAGS='-s read-only -c model_reasoning_effort="high"'

# ── Loop behaviour ──
MAX_ITERATIONS=3          # implement→review rounds before giving up
USE_HC=auto               # auto | yes | no  — run subagents as visible Herdr terminals via `hc`
SUBAGENT_TIMEOUT=3600     # seconds per subagent run
NEW_BRANCH=yes            # yes: create pastir/<id> per run | no: commit on the currently checked-out branch

# ── Token savings ──
# LEAN_CLAUDE=yes starts the orchestrator and Claude subagents without MCP servers and without
# skills/slash commands (their schemas and listings are re-sent on every request). CLAUDE.md is
# still loaded. If --strict-mcp-config cannot be used (enterprise-managed MCP config, or an older
# CLI), every MCP tool is denied instead (--disallowedTools 'mcp__*'). Set to no if your planner or
# implementer needs an MCP server.
LEAN_CLAUDE=yes
# Lines of each subagent's output shown to the orchestrator (the full file is always on disk).
OUTPUT_PREVIEW_LINES=80
